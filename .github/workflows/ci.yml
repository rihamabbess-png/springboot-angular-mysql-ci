name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image Backend
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest ./backend

      - name: Build image Frontend
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest ./frontend

      - name: Push image Backend
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Push image Frontend
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Test avec Docker Compose
        run: |
          docker compose up -d
          sleep 30
          docker compose ps
